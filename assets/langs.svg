<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120">
  <defs>
    <clipPath id="bar-shape">
      <rect x="20" y="42" width="760" height="22" rx="4"/>
    </clipPath>
    <!-- Shimmer gradient — fills the moving rect left to right -->
    <linearGradient id="shimmer-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="10%"  stop-color="white" stop-opacity="0.05"/>
      <stop offset="20%"  stop-color="white" stop-opacity="0.15"/>
      <stop offset="30%"  stop-color="white" stop-opacity="0.3"/>
      <stop offset="40%"  stop-color="white" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="white" stop-opacity="0.8"/>
      <stop offset="60%"  stop-color="white" stop-opacity="0.55"/>
      <stop offset="70%"  stop-color="white" stop-opacity="0.3"/>
      <stop offset="80%"  stop-color="white" stop-opacity="0.15"/>
      <stop offset="90%"  stop-color="white" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="shimmer-clip">
      <rect x="20" y="42" width="760" height="22" rx="4"/>
    </clipPath>
  </defs>
  <style>
    @media (prefers-color-scheme: dark) {
      .ttl { fill: #e6edf3; }
      .trk { fill: #21262d; }
      .leg { fill: #b1bac4; }
    }
    @media (prefers-color-scheme: light) {
      .ttl { fill: #1f2328; }
      .trk { fill: #eaeef2; }
      .leg { fill: #424a53; }
    }
    .ttl { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 14px; font-weight: 600; }
    .leg { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; font-size: 12px; font-weight: 500; }

    .shimmer { will-change: transform; animation: shimmer-slide 8s linear infinite; }
    @keyframes shimmer-slide {
      0%   { transform: translateX(-180px); }
      72%  { transform: translateX(-180px); animation-timing-function: cubic-bezier(0.3,0,0.7,1); }
      100% { transform: translateX(960px); }
    }

    .pulse { will-change: transform; animation: legend-pulse 2.5s cubic-bezier(0.4,0,0.6,1) infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes legend-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.3); }
    }
  </style>

  <text class="ttl" x="400" y="24" text-anchor="middle">Top Languages</text>

  <!-- Bar track (background) -->
  <rect class="trk" x="20" y="42" width="760" height="22" rx="4"/>

  <!-- Colored segments -->
  <g clip-path="url(#bar-shape)">
      <rect x="20" y="42" width="333" height="22" fill="#f1e05a"/>
      <rect x="353" y="42" width="163" height="22" fill="#7355dd"/>
      <rect x="516" y="42" width="78" height="22" fill="#663399"/>
      <rect x="594" y="42" width="71" height="22" fill="#012456"/>
      <rect x="665" y="42" width="61" height="22" fill="#3178c6"/>
      <rect x="726" y="42" width="54" height="22" fill="#e34c26"/>
  </g>

  <!-- Shimmer overlay on bar: diagonal rect translates across, clipped to bar -->
  <g clip-path="url(#shimmer-clip)">
    <g transform="skewX(-20)">
      <rect class="shimmer" x="0" y="38" width="160" height="30" fill="url(#shimmer-grad)"/>
    </g>
  </g>

  <!-- Legend with pulse -->
  <circle class="pulse" cx="25" cy="88" r="5" fill="#f1e05a" style="animation-delay:0.0s;"/>
  <text x="36" y="92.5" class="leg">JavaScript 43.8%</text>
  <circle class="pulse" cx="151" cy="88" r="5" fill="#7355dd" style="animation-delay:0.4s;"/>
  <text x="162" y="92.5" class="leg">C# 21.5%</text>
  <circle class="pulse" cx="277" cy="88" r="5" fill="#663399" style="animation-delay:0.8s;"/>
  <text x="288" y="92.5" class="leg">CSS 10.3%</text>
  <circle class="pulse" cx="403" cy="88" r="5" fill="#012456" style="animation-delay:1.2s;"/>
  <text x="414" y="92.5" class="leg">PowerShell 9.3%</text>
  <circle class="pulse" cx="529" cy="88" r="5" fill="#3178c6" style="animation-delay:1.6s;"/>
  <text x="540" y="92.5" class="leg">TypeScript 8.0%</text>
  <circle class="pulse" cx="655" cy="88" r="5" fill="#e34c26" style="animation-delay:2.0s;"/>
  <text x="666" y="92.5" class="leg">HTML 7.1%</text>

</svg>