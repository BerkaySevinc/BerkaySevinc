<svg xmlns="http://www.w3.org/2000/svg" width="102" height="34" viewBox="0 0 102 34">
  <defs>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#4d2680" flood-opacity="0">
        <animate attributeName="flood-opacity" values="0.00;0.12;0.24;0.36;0.46;0.55;0.63;0.69;0.73;0.75;0.75;0.73;0.69;0.63;0.55;0.46;0.36;0.24;0.12;0.00" dur="4s" repeatCount="indefinite"
                 calcMode="spline" keyTimes="0.00;0.05;0.11;0.16;0.21;0.26;0.32;0.37;0.42;0.47;0.53;0.58;0.63;0.68;0.74;0.79;0.84;0.89;0.95;1.00" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
      </feDropShadow>
    </filter>
    <filter id="text-blur" x="-60%" y="-80%" width="220%" height="260%">
      <feGaussianBlur stdDeviation="8 3" result="b"/>
      <feComponentTransfer in="b" result="h"><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode in="h"/><feMergeNode in="h"/></feMerge>
    </filter>
  </defs>

  <rect x="3" y="3" width="96" height="28" rx="4" fill="#4d2680" filter="url(#glow)" style="will-change:filter;"/>
  <rect x="3" y="3" width="7" height="28" rx="4" fill="#341a57"/>
  <rect x="6" y="3" width="4" height="28" fill="#341a57"/>
  <text x="55" y="21" text-anchor="middle" fill="#000000" filter="url(#text-blur)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">.NET</text>
  <text x="55" y="21" text-anchor="middle" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">.NET</text>
</svg>